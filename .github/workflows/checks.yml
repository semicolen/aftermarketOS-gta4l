name: Device source checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: PYTHONPATH=builder python -m unittest discover -s tests -v
      - run: PYTHONPATH=builder python -m debport plan profiles/samsung-gta4l.json
      - run: for file in tools/*.sh recovery/*.sh boot/*.sh; do sh -n "$file"; done
